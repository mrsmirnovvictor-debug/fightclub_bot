<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Арсенал клуба</title>
<style>
  /* Сверочный лист оружейной: панель отбора сверху, дальше сетка
     карточек «картинка — числа — пометка». Сталь и ринг: холодные
     нейтрали, кровяной акцент у оружия, стальной — у щитов. */
  :root {
    --bg: #16171a;
    --card: #1e2024;
    --line: #32353b;
    --fg: #eceae5;
    --muted: #9a9892;
    --steel: #7fb0cc;
    --blood: #e06a6a;
    --pad: #23262b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  img { max-width: 100%; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 56px; }
  h1 {
    font-size: clamp(24px, 6vw, 34px);
    letter-spacing: .01em;
    margin: 0;
    text-transform: uppercase;
  }
  .lede { color: var(--muted); margin: 6px 0 0; max-width: 64ch; }
  .tally {
    display: flex; flex-wrap: wrap; gap: 6px 18px;
    margin: 14px 0 0; padding: 0; list-style: none;
    font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13.5px;
  }
  .tally b { color: var(--fg); }

  .bar {
    position: sticky; top: 0; z-index: 5;
    margin: 18px 0 0; padding: 10px 0;
    background: var(--bg); border-bottom: 1px solid var(--line);
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  }
  input[type="search"] {
    flex: 1 1 200px; min-width: 0;
    font: inherit; color: var(--fg); background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip, .ghost {
    font: inherit; font-size: 13.5px;
    color: var(--muted); background: var(--card);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 12px; cursor: pointer;
  }
  .ghost { border-radius: 8px; color: var(--steel); }
  .chip[aria-pressed="true"] { color: var(--bg); background: var(--fg); border-color: var(--fg); }
  .chip.warn[aria-pressed="true"] { background: var(--blood); border-color: var(--blood); color: #16171a; }
  :focus-visible { outline: 2px solid var(--steel); outline-offset: 2px; }

  .general { margin: 18px 0 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .general h2 {
    font-size: 13px; letter-spacing: .06em; text-transform: uppercase;
    margin: 0 0 8px; color: var(--muted); font-weight: 500;
  }
  textarea {
    width: 100%; min-height: 68px;
    font: inherit; color: var(--fg); background: var(--pad);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px;
    resize: vertical;
  }
  .state { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; min-height: 1.2em; }
  .state.saved { color: var(--steel); }

  .group { margin: 26px 0 0; }
  .group > h2 {
    font-size: 16px; letter-spacing: .04em; text-transform: uppercase;
    margin: 0 0 2px;
  }
  .group > p { margin: 0 0 12px; color: var(--muted); font-size: 13.5px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 12px;
  }
  .card.flag { border-color: var(--blood); }
  .shot {
    width: 120px; height: 120px; border-radius: 8px; overflow: hidden;
    background: #60656b; display: grid; place-items: center;
    font-size: 32px; color: #fff; text-decoration: none;
  }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .body { min-width: 0; }
  .name { font-weight: 600; font-size: 16px; margin: 0; }
  .was { margin: 2px 0 0; font-size: 13px; color: var(--blood); }
  .code { font-size: 12px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin: 7px 0 0; padding: 0; list-style: none; }
  .tags li {
    font-size: 12px; color: var(--muted); background: var(--pad);
    border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px;
  }
  .tags li.lvl { color: var(--fg); font-variant-numeric: tabular-nums; }
  .tags li.fam { color: var(--blood); }
  .tags li.hold { color: var(--steel); }
  dl.nums {
    margin: 9px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px;
    font-size: 13.5px; font-variant-numeric: tabular-nums;
  }
  dl.nums dt { color: var(--muted); }
  dl.nums dd { margin: 0; }
  .whose { margin: 9px 0 0; font-size: 13px; color: var(--muted); }
  .whose b { color: var(--fg); }
  .note { grid-column: 1 / -1; }
  .note label {
    display: block; font-size: 12px; letter-spacing: .05em; text-transform: uppercase;
    color: var(--muted); margin: 2px 0 5px;
  }
  .note textarea { min-height: 54px; }
  .marked { border-color: var(--steel); }
  .marked .note label { color: var(--steel); }
  .empty { margin: 24px 0; color: var(--muted); }
  @media (max-width: 420px) {
    .card { grid-template-columns: 92px minmax(0, 1fr); }
    .shot { width: 92px; height: 92px; font-size: 26px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Арсенал клуба</h1>
  <p class="lede">Всё, что боец берёт в руки: оружие, щиты и единственный огнестрел.
    Картинки — прямо из бакета, числа и наборы — из каталога этого выката.
    Пометки остаются в этом браузере; кнопка сверху собирает их одним текстом.</p>
  <ul class="tally" id="tally"></ul>

  <div class="bar">
    <input type="search" id="find" placeholder="Поиск по названию, набору, классу" autocomplete="off">
    <div class="chips" id="chips"></div>
    <button type="button" class="ghost" id="reload">Обновить картинки</button>
    <button type="button" class="ghost" id="copy">Скопировать пометки</button>
    <button type="button" class="ghost" id="save">Скачать пометки</button>
  </div>

  <section class="general">
    <h2>Общая записка</h2>
    <textarea id="general" placeholder="Что поправить по всему арсеналу: стиль, фон, кадрирование"></textarea>
    <p class="state" id="general-state"></p>
  </section>

  <div id="list"><p class="empty">Загружаю каталог…</p></div>
</div>

<script>
(() => {
  "use strict";
  const list = document.getElementById("list");
  const notes = new Map();
  const fields = new Map();
  const KINDS = ["Оружие", "Щит", "Огнестрел"];
  const state = { kind: "", flagged: false, text: "" };
  let ITEMS = [];
  let stamp = 0;

  // Пометки живут в этом браузере: сервер их не хранит, и на игру они
  // не влияют. Чтение и запись обёрнуты — в приватном окне хранилище
  // бросает, и лист от этого падать не должен
  const KEY = "arsenal-notes";
  const STAMP = "arsenal-stamp";
  try {
    const kept = JSON.parse(localStorage.getItem(KEY) || "{}");
    Object.entries(kept).forEach(([code, text]) => notes.set(code, String(text)));
    stamp = Number(localStorage.getItem(STAMP)) || 0;
  } catch (e) { /* приватное окно */ }

  function keep() {
    try {
      const flat = {};
      notes.forEach((text, code) => { if (text.trim()) flat[code] = text; });
      localStorage.setItem(KEY, JSON.stringify(flat));
      said("Пометки сохранены в этом браузере", "saved");
    } catch (e) {
      said("Браузер не дал сохранить пометки — скопируй их кнопкой сверху", "");
    }
  }

  function said(text, cls) {
    const box = document.getElementById("general-state");
    box.className = "state " + (cls || "");
    box.textContent = text;
  }

  // Имена файлов в бакете не меняются, и браузер охотно отдаёт старую
  // копию из кеша. Версия в адресе её обходит
  const shot = (url) => (stamp ? url + (url.includes("?") ? "&" : "?") + "v=" + stamp : url);

  const chips = document.getElementById("chips");
  KINDS.forEach((kind) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = kind;
    b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", () => {
      state.kind = state.kind === kind ? "" : kind;
      paintChips();
      render();
    });
    chips.appendChild(b);
  });
  const flagChip = document.createElement("button");
  flagChip.type = "button";
  flagChip.className = "chip warn";
  flagChip.textContent = "Переименованные";
  flagChip.setAttribute("aria-pressed", "false");
  flagChip.addEventListener("click", () => {
    state.flagged = !state.flagged;
    paintChips();
    render();
  });
  chips.appendChild(flagChip);

  function paintChips() {
    [...chips.children].forEach((b) => {
      const on = b === flagChip ? state.flagged : state.kind === b.textContent;
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
  }

  document.getElementById("find").addEventListener("input", (e) => {
    state.text = e.target.value.trim().toLowerCase();
    render();
  });

  document.getElementById("reload").addEventListener("click", () => {
    stamp = Date.now();
    try { localStorage.setItem(STAMP, String(stamp)); } catch (e) { /* приватное окно */ }
    document.querySelectorAll("img[data-src]").forEach((img) => {
      img.src = shot(img.dataset.src);
    });
    said("Картинки запрошены заново", "saved");
  });

  function asText() {
    const lines = [];
    const general = (notes.get("__general") || "").trim();
    if (general) lines.push("Общая записка: " + general, "");
    ITEMS.forEach((one) => {
      const text = (notes.get(one.code) || "").trim();
      if (text) lines.push("- " + one.title + " (" + one.code + "): " + text);
    });
    return lines.length ? lines.join("\n") : "Пометок пока нет.";
  }

  document.getElementById("copy").addEventListener("click", async (e) => {
    const out = asText();
    try {
      await navigator.clipboard.writeText(out);
      e.target.textContent = "Скопировано";
      setTimeout(() => { e.target.textContent = "Скопировать пометки"; }, 1600);
    } catch (err) {
      const box = document.getElementById("general");
      box.value = out;
      box.focus();
      box.select();
    }
  });

  document.getElementById("save").addEventListener("click", () => {
    const blob = new Blob([asText()], { type: "text/plain;charset=utf-8" });
    const away = document.createElement("a");
    away.href = URL.createObjectURL(blob);
    away.download = "арсенал-пометки.txt";
    document.body.appendChild(away);
    away.click();
    away.remove();
    setTimeout(() => URL.revokeObjectURL(away.href), 4000);
  });

  function tag(text, cls) {
    const li = document.createElement("li");
    li.textContent = text;
    if (cls) li.className = cls;
    return li;
  }

  function pair(dl, label, value) {
    const dt = document.createElement("dt");
    dt.textContent = label;
    const dd = document.createElement("dd");
    dd.textContent = value;
    dl.append(dt, dd);
  }

  function card(one) {
    const box = document.createElement("article");
    box.className = "card" + (one.was ? " flag" : "");
    if ((notes.get(one.code) || "").trim()) box.classList.add("marked");

    // Картинка — ссылкой: нажатие открывает файл бакета целиком, в
    // своём размере. Сверять арт по клетке 120 на 120 неудобно
    const pic = document.createElement("a");
    pic.className = "shot";
    pic.href = one.image;
    pic.target = "_blank";
    pic.rel = "noreferrer";
    const img = document.createElement("img");
    img.alt = one.title;
    img.loading = "lazy";
    img.dataset.src = one.image;
    img.src = shot(one.image);
    img.addEventListener("error", () => {
      pic.textContent = one.icon || "—";
      pic.title = "Файла в бакете нет";
    }, { once: true });
    pic.appendChild(img);

    const body = document.createElement("div");
    body.className = "body";

    const name = document.createElement("p");
    name.className = "name";
    name.textContent = one.title;
    body.appendChild(name);

    if (one.was) {
      const was = document.createElement("p");
      was.className = "was";
      was.textContent = "раньше звалась: " + one.was;
      body.appendChild(was);
    }

    const code = document.createElement("span");
    code.className = "code";
    code.textContent = one.code;
    body.appendChild(code);

    const tags = document.createElement("ul");
    tags.className = "tags";
    tags.appendChild(tag(one.kind));
    tags.appendChild(tag(one.level + " ур.", "lvl"));
    if (one.family) tags.appendChild(tag(one.family, "fam"));
    if (one.hand) tags.appendChild(tag(one.hand));
    if (one.hold) tags.appendChild(tag(one.hold, "hold"));
    if (one.mastery) tags.appendChild(tag("владение " + one.mastery, "lvl"));
    if (one.reward) tags.appendChild(tag("награда"));
    if (one.retired) tags.appendChild(tag("снято с прилавка"));
    body.appendChild(tags);

    const dl = document.createElement("dl");
    dl.className = "nums";
    if (one.damage) pair(dl, "Урон", one.damage[0] + "–" + one.damage[1]);
    if (one.armor) pair(dl, "Броня", one.armor[0] + "–" + one.armor[1]);
    if (one.shots) pair(dl, "Патроны", String(one.shots));
    Object.entries(one.gains).forEach(([k, v]) => pair(dl, k, "+" + v));
    Object.entries(one.shares).forEach(([k, v]) => pair(dl, k, "+" + v + "%"));
    const need = Object.entries(one.requires).map(([k, v]) => k + " " + v).join(", ");
    if (need) pair(dl, "Нужно", need);
    if (one.stars) pair(dl, "Цена", one.stars + " ⭐");
    else if (one.price) pair(dl, "Цена", one.price + " 💰");
    if (dl.children.length) body.appendChild(dl);

    const whose = document.createElement("p");
    whose.className = "whose";
    if (one.set) {
      whose.append("набор ");
      const b = document.createElement("b");
      b.textContent = one.set;
      whose.append(b, " · ");
    }
    if (one.classes.length) {
      whose.append("класс ");
      const b = document.createElement("b");
      b.textContent = one.classes.join(", ");
      whose.append(b);
    } else {
      whose.append("для всех классов");
    }
    body.appendChild(whose);

    const note = document.createElement("div");
    note.className = "note";
    const label = document.createElement("label");
    label.htmlFor = "note-" + one.code;
    label.textContent = "Пометка";
    const area = document.createElement("textarea");
    area.id = "note-" + one.code;
    area.placeholder = "Что не так с картинкой или вещью";
    area.value = notes.get(one.code) || "";
    let timer = 0;
    area.addEventListener("input", () => {
      notes.set(one.code, area.value);
      box.classList.toggle("marked", Boolean(area.value.trim()));
      clearTimeout(timer);
      timer = setTimeout(keep, 500);
    });
    note.append(label, area);
    fields.set(one.code, area);

    box.append(pic, body, note);
    return box;
  }

  function matches(one) {
    if (state.kind && one.kind !== state.kind) return false;
    if (state.flagged && !one.was) return false;
    if (!state.text) return true;
    const hay = [one.title, one.was, one.code, one.set, one.family, one.hold, one.kind]
      .concat(one.classes).join(" ").toLowerCase();
    return hay.includes(state.text);
  }

  function plural(n, one, few, many) {
    const ten = n % 10;
    const hundred = n % 100;
    if (ten === 1 && hundred !== 11) return one;
    if (ten >= 2 && ten <= 4 && (hundred < 12 || hundred > 14)) return few;
    return many;
  }

  function render() {
    const shown = ITEMS.filter(matches);
    list.textContent = "";
    fields.clear();
    if (!shown.length) {
      const nothing = document.createElement("p");
      nothing.className = "empty";
      nothing.textContent = "Под отбор ничего не попало.";
      list.appendChild(nothing);
      return;
    }
    const groups = new Map();
    shown.forEach((one) => {
      const head = one.set ? "Набор «" + one.set + "»" : "Без набора · " + one.kind;
      if (!groups.has(head)) groups.set(head, []);
      groups.get(head).push(one);
    });
    groups.forEach((rows, head) => {
      const section = document.createElement("section");
      section.className = "group";
      const h2 = document.createElement("h2");
      h2.textContent = head;
      const sub = document.createElement("p");
      const renamed = rows.filter((one) => one.was).length;
      sub.textContent = rows.length + " " + plural(rows.length, "вещь", "вещи", "вещей")
        + (renamed ? " · переименовано: " + renamed : "");
      const grid = document.createElement("div");
      grid.className = "grid";
      rows.forEach((one) => grid.appendChild(card(one)));
      section.append(h2, sub, grid);
      list.appendChild(section);
    });
  }

  function tally(counts) {
    const box = document.getElementById("tally");
    box.textContent = "";
    [
      ["всего", counts.all],
      ["оружие", counts.weapons],
      ["щиты", counts.shields],
      ["в наборах", counts.in_sets],
      ["переименовано", counts.renamed],
    ].forEach(([label, n]) => {
      const li = document.createElement("li");
      const b = document.createElement("b");
      b.textContent = n;
      li.append(b, " " + label);
      box.appendChild(li);
    });
  }

  const general = document.getElementById("general");
  general.value = notes.get("__general") || "";
  let generalTimer = 0;
  general.addEventListener("input", () => {
    notes.set("__general", general.value);
    clearTimeout(generalTimer);
    generalTimer = setTimeout(keep, 500);
  });

  fetch("api/arsenal")
    .then((answer) => {
      if (!answer.ok) throw new Error("сервер ответил " + answer.status);
      return answer.json();
    })
    .then((data) => {
      ITEMS = data.items || [];
      tally(data.counts || {});
      render();
    })
    .catch((err) => {
      list.textContent = "";
      const oops = document.createElement("p");
      oops.className = "empty";
      oops.textContent = "Каталог не загрузился: " + err.message;
      list.appendChild(oops);
    });
})();
</script>
</body>
</html>
