<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Карточка бойца</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="static/card.css">
</head>
<body>
  <div id="loader" class="loader">Судья листает картотеку…</div>

  <div id="error" class="error hidden">
    <div class="error-emoji">🥊</div>
    <div class="error-text"></div>
  </div>

  <nav class="tabs hidden" id="tabs">
    <button type="button" class="tab active" id="tab-card">🥊 Боец</button>
    <button type="button" class="tab" id="tab-shop">🏪 Магазин</button>
  </nav>

  <main id="card" class="card hidden">
    <header class="head">
      <span class="head-class" id="class-emoji"></span>
      <h1 class="head-name" id="name"></h1>
      <span class="head-level" id="level"></span>
    </header>

    <div class="hp" id="hp">
      <div class="hp-fill" id="hp-fill"></div>
      <div class="hp-text" id="hp-text"></div>
    </div>
    <div class="hp-note" id="hp-note"></div>

    <section class="doll">
      <div class="slots" id="slots-left"></div>
      <div class="avatar" id="avatar"></div>
      <div class="slots" id="slots-right"></div>
    </section>

    <div class="city" id="city"></div>

    <section class="panel">
      <ul class="rows" id="stats"></ul>
      <hr class="rule">
      <ul class="rows" id="progress"></ul>
      <hr class="rule">
      <ul class="rows" id="record"></ul>
    </section>

    <section class="bag hidden" id="bag">
      <h2 class="bag-head">🎒 Инвентарь <span class="bag-count" id="bag-count"></span></h2>
      <div class="bag-list" id="bag-list"></div>
      <p class="bag-empty hidden" id="bag-empty">
        Рюкзак пуст. Вещи покупаются в лавке клуба: напиши боту /buy.
      </p>
    </section>

    <footer class="foot" id="foot"></footer>
  </main>

  <main id="shop" class="shop hidden">
    <header class="shop-head">
      <h1 class="shop-title">🏪 Лавка клуба</h1>
      <span class="shop-purse" id="shop-purse"></span>
    </header>
    <p class="shop-note" id="shop-note"></p>

    <div class="filters" id="filters">
      <div class="filter-row">
        <span class="filter-label">Тип</span>
        <div class="chips" id="filter-type"></div>
      </div>
      <div class="filter-row">
        <span class="filter-label">Уровень</span>
        <div class="chips" id="filter-level"></div>
      </div>
    </div>

    <p class="shop-empty hidden" id="shop-empty">
      Под эти фильтры на прилавке ничего нет.
    </p>
    <div id="shop-list"></div>
  </main>

  <script src="static/card.js"></script>
</body>
</html>
